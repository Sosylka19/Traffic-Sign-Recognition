services:
  db:
    image: postgres:latest
    container_name: postgres_db
    env_file:
      - .env
    volumes:
      - ./backend/app/dataset:/docker-entrypoint-initdb.d
      - ./backend/app/postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d users_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G  


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_app
    depends_on:
      - db
    env_file:
      - .env
    ports: 
      - "8000:80"
    restart: unless-stopped

    